<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>化学反応式 SPEED RUN</title>
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --accent: #facc15;
            --correct: #22c55e; --wrong: #ef4444; --blue: #3b82f6; --purple: #8b5cf6;
        }
        * { user-select: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: sans-serif; background: linear-gradient(135deg, var(--bg), #1e293b); color: white; text-align: center; min-height: 100vh; touch-action: manipulation; }
        .screen { display: none; padding: 15px; animation: fadeIn 0.3s; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        h1 { font-size: 1.8rem; color: var(--accent); margin-bottom: 20px; }
        .modeButton { width: 90%; max-width: 300px; height: 65px; margin: 8px; border: none; border-radius: 15px; font-size: 1.3rem; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 0 rgba(0,0,0,0.3); }
        .modeButton:active { transform: translateY(2px); box-shadow: none; }
        .basicBtn { background: var(--blue); }
        .advancedBtn { background: var(--purple); }
        .allBtn { background: var(--correct); }
        #selectedModeText { font-size: 1.1rem; margin: 15px 0; color: #94a3b8; min-height: 1.5rem; }
        #countdown { font-size: 5rem; height: 6rem; color: var(--correct); font-weight: bold; }
        #equationContainer { background: var(--card); border-radius: 20px; padding: 30px 15px; margin: 10px auto 25px; width: 95%; max-width: 600px; min-height: 140px; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: inset 0 2px 10px rgba(0,0,0,0.5); }
        #equation { font-size: 1.4rem; line-height: 1.4; margin-bottom: 15px; word-break: break-all; font-weight: bold; }
        #labels { font-size: 0.9rem; color: #93c5fd; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .label-item { border-top: 1px solid #475569; padding-top: 4px; }
        #btnContainer { display: flex; justify-content: space-around; width: 100%; max-width: 500px; margin: 0 auto; }
        .answerBtn { width: 120px; height: 120px; border: none; border-radius: 50%; font-size: 3.5rem; font-weight: bold; cursor: pointer; transition: 0.1s; box-shadow: 0 6px 0 rgba(0,0,0,0.2); }
        .answerBtn:active { transform: translateY(4px); box-shadow: none; }
        #correctBtn { background: var(--correct); }
        #wrongBtn { background: var(--wrong); }
        #resultArea { margin-top: 20px; }
        .fail { color: var(--wrong); font-size: 2rem; font-weight: bold; }
        .correctAnswer { color: var(--accent); font-size: 1.1rem; font-weight: bold; }
        .smallBtn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; background: #64748b; color: white; margin-top: 15px; }
    </style>
</head>
<body>

<div id="menuScreen" class="screen active">
    <h1>化学反応式 SPEED RUN</h1>
    <button class="modeButton basicBtn" onclick="selectMode('basic')">化学基礎</button><br>
    <button class="modeButton advancedBtn" onclick="selectMode('advanced')">化学</button><br>
    <button class="modeButton allBtn" onclick="selectMode('all')">全部</button>
    <div id="selectedModeText">モードを選択してください</div>
    <div id="countdown"></div>
    <button id="startGameBtn" class="modeButton allBtn" style="display:none;" onclick="countdownStart()">START</button>
</div>

<div id="gameScreen" class="screen">
    <div id="reactionType" style="color:#93c5fd; font-size:1rem;">---</div>
    <div id="progress" style="font-size:1.8rem; color:var(--accent); margin: 5px 0;">0 / 10</div>
    <div id="equationContainer">
        <div id="equation">---</div>
        <div id="labels"></div>
    </div>
    <div id="btnContainer">
        <button id="wrongBtn" class="answerBtn" onclick="judge(false)">×</button>
        <button id="correctBtn" class="answerBtn" onclick="judge(true)">○</button>
    </div>
    <div id="resultArea"></div>
</div>

<script>
// 全問題データ
const basicQuestions = [
  { type:"中和", eq:"HCl + NaOH → NaCl + H₂O", correct:true },
    { type:"中和", eq:"H₂SO₄ + 2NaOH → Na₂SO₄ + 2H₂O", correct:true },
    { type:"中和", eq:"H₂SO₄ + NaOH → Na₂SO₄ + H₂O", correct:false },
    { type:"酸化還元", eq:"2Mg + O₂ → 2MgO", correct:true },
    { type:"酸化還元", eq:"Mg + O₂ → MgO", correct:false },
    { type:"熱分解", eq:"2NaHCO₃ → Na₂CO₃ + H₂O + CO₂", correct:true },
    { type:"燃焼", eq:"CH₄ + 2O₂ → CO₂ + 2H₂O", correct:true },
    { type:"酸化還元", eq:"MnO₄⁻ + 8H⁺ + 5e⁻ → Mn²⁺ + 4H₂O", correct:true },
    { type:"中和", eq:"CH₃COOH + NaOH → CH₃COONa + H₂O", correct:true },
    { type:"沈殿", eq:"Ag⁺ + Cl⁻ → AgCl", correct:true },
    { type:"中和", eq:"HCl + Ca(OH)₂ → CaCl₂ + 2H₂O", correct:true },
    { type:"酸化還元", eq:"2H₂ + O₂ → 2H₂O", correct:true },
    { type:"熱分解", eq:"CaCO₃ → CaO + CO₂", correct:true },
    { type:"酸化還元", eq:"Fe + S → FeS", correct:true },
    { type:"酸化還元", eq:"2H₂O₂ → 2H₂O + O₂", correct:true },
    { type:"中和", eq:"2HCl + Ca(OH)₂ → CaCl₂ + 2H₂O", correct:true },
    { type:"沈殿", eq:"Ba²⁺ + SO₄²⁻ → BaSO₄", correct:true },
    { type:"酸化還元", eq:"Cu + 2Ag⁺ → Cu²⁺ + 2Ag", correct:true },
    { type:"中和", eq:"HNO₃ + KOH → KNO₃ + H₂O", correct:true },
    { type:"燃焼", eq:"2CO + O₂ → 2CO₂", correct:true }
];

const advancedQuestions = [
   { type:"置換", eq:"C₆H₆ + HNO₃ → C₆H₅NO₂ + H₂O", correct:true },
    { type:"置換", eq:"C₆H₆ + H₂SO₄ → C₆H₅SO₃H + H₂O", correct:true },
    { type:"付加", eq:"C₆H₆ + 3H₂ → C₆H₁₂", correct:true },
    { type:"置換", eq:"C₆H₆ + Cl₂ → C₆H₅Cl + HCl", correct:true },
    { type:"クメン法", eq:"C₆H₅CH(CH₃)₂ + O₂ → C₆H₅OH + CH₃COCH₃", correct:true },
    { type:"中和", eq:"C₆H₅OH + NaOH → C₆H₅ONa + H₂O", correct:true },
    { type:"銀鏡反応", eq:"R-CHO + 2[Ag(NH₃)₂]⁺ + 2OH⁻ → R-COOH + 2Ag + 4NH₃ + H₂O", correct:true },
    { type:"酸化", eq:"4NH₃ + 5O₂ → 4NO + 6H₂O", correct:true },
    { type:"エステル化", eq:"CH₃COOH + C₂H₅OH → CH₃COOC₂H₅ + H₂O", correct:true },
    { type:"付加", eq:"CH₂=CH₂ + H₂ → CH₃CH₃", correct:true },
    { type:"付加", eq:"CH₂=CH₂ + Br₂ → CH₂BrCH₂Br", correct:true },
    { type:"置換", eq:"CH₄ + Cl₂ → CH₃Cl + HCl", correct:true },
    { type:"加水分解", eq:"CH₃COOC₂H₅ + H₂O → CH₃COOH + C₂H₅OH", correct:true },
    { type:"中和", eq:"R-COOH + NaOH → R-COONa + H₂O", correct:true },
    { type:"酸化", eq:"CH₃CH₂OH → CH₃CHO → CH₃COOH", correct:true },
    { type:"還元", eq:"CH₃CHO + H₂ → CH₃CH₂OH", correct:true },
    { type:"脱水", eq:"2C₂H₅OH → C₂H₅OC₂H₅ + H₂O", correct:true },
    { type:"付加", eq:"CH≡CH + 2H₂ → CH₃CH₃", correct:true },
    { type:"置換", eq:"C₆H₅OH + 3HNO₃ → C₆H₂(NO₂)₃OH + 3H₂O", correct:true },
    { type:"合成", eq:"n(CH₂=CH₂) → -(CH₂-CH₂)-n", correct:true }
];

let mode = "", currentPool = [], score = 0, gameActive = false;

function selectMode(m) {
    mode = m;
    document.getElementById("selectedModeText").innerText = "モード: " + (m==='basic'?'化学基礎':m==='advanced'?'化学':'全部');
    document.getElementById("startGameBtn").style.display = "inline-block";
}

function countdownStart() {
    let count = 3; document.getElementById("startGameBtn").style.display = "none";
    const cd = document.getElementById("countdown");
    const t = setInterval(() => {
        cd.innerText = count > 0 ? count : count === 0 ? "GO!" : "";
        if(count < -1) { clearInterval(t); start(); }
        count--;
    }, 700);
}

function start() {
    score = 0; gameActive = true;
    // どちらのモードでも全データを参照できるようにコピー
    let source = mode === 'basic' ? [...basicQuestions] : 
                 mode === 'advanced' ? [...advancedQuestions] : 
                 [...basicQuestions, ...advancedQuestions];
    
    currentPool = [];
    // 10問抽出ロジック（同じ問題が連続しないように配慮）
    for(let i = 0; i < 10; i++) {
        if(source.length === 0) source = mode === 'basic' ? [...basicQuestions] : mode === 'advanced' ? [...advancedQuestions] : [...basicQuestions, ...advancedQuestions];
        let idx = Math.floor(Math.random() * source.length);
        currentPool.push(source.splice(idx, 1)[0]);
    }
    
    document.getElementById("menuScreen").classList.remove("active");
    document.getElementById("gameScreen").classList.add("active");
    next();
}

function next() {
    if(score >= 10) { alert("クリア！"); location.reload(); return; }
    let q = currentPool[score];
    document.getElementById("progress").innerText = `${score + 1} / 10`;
    document.getElementById("reactionType").innerText = q.type;
    document.getElementById("equation").innerText = q.eq;
    const labelContainer = document.getElementById("labels");
    labelContainer.innerHTML = "";
    if (q.labels) q.labels.forEach(l => { const s = document.createElement("span"); s.className = "label-item"; s.innerText = l; labelContainer.appendChild(s); });
}

function judge(choice) {
    if(!gameActive) return;
    if(choice === currentPool[score].correct) { score++; next(); } 
    else { 
        gameActive = false;
        document.getElementById("btnContainer").style.display = "none";
        document.getElementById("resultArea").innerHTML = `<div class="fail">MISS!</div><div class="correctAnswer">${currentPool[score].answer}</div><br><button class="smallBtn" onclick="location.reload()">メニューに戻る</button>`;
    }
}
</script>
</body>
</html>
